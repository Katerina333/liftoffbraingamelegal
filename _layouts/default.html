<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Liftoff: Brain Memory Focus</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f7fd;
      --card: #ffffff;
      --text: #172149;
      --text-dim: #3d4a78;
      --accent: #c97a06;
      --accent-bg: #f59e1c;
      --link: #1f5bd8;
      --border: #d9e1f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1735;
        --card: #182349;
        --text: #f4f6ff;
        --text-dim: #c2cbeb;
        --accent: #ffb03d;
        --accent-bg: #ffb03d;
        --link: #8db8ff;
        --border: #2b3a6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
      font-size: 19px;
      line-height: 1.65;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 28px 22px 72px; }
    header { padding: 12px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 44px; height: 44px; border-radius: 11px; flex: none;
      background: linear-gradient(160deg, #1b2a63, #0f1735);
      display: grid; place-items: center;
    }
    .mark svg { width: 24px; height: 24px; }
    h1 { margin: 0; font-size: 1.75rem; font-weight: 800; line-height: 1.2; }
    .subtitle { color: var(--text-dim); font-size: 1rem; margin: 2px 0 0; }
    nav { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
    nav a {
      display: inline-block; padding: 8px 16px; min-height: 44px; line-height: 28px;
      border: 1.5px solid var(--border); border-radius: 999px; background: var(--card);
      color: var(--text); text-decoration: none; font-weight: 700; font-size: 1rem;
    }
    nav a[aria-current="page"] { border-color: var(--accent-bg); }
    h2 { margin-top: 2em; font-size: 1.3rem; color: var(--accent); }
    h3 { margin-top: 1.5em; font-size: 1.1rem; }
    a { color: var(--link); }
    .meta { color: var(--text-dim); font-size: 1rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 6px 22px; margin: 20px 0;
    }
    ul, ol { padding-left: 1.3em; }
    li { margin-bottom: 6px; }
    footer {
      margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--border);
      color: var(--text-dim); font-size: 0.95rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#ffb03d" d="M13.2 2 4.5 13.4h6.1L9.4 22l8.9-11.9h-6.2z"/></svg>
        </span>
        <div>
          <h1>{{ page.title }}</h1>
          <p class="subtitle">Liftoff: Brain Memory Focus — iOS</p>
        </div>
      </div>
      <nav aria-label="Pages">
        <a href="{{ site.baseurl }}/" {% if page.url == "/" %}aria-current="page"{% endif %}>Support</a>
        <a href="{{ site.baseurl }}/privacy.html" {% if page.url == "/privacy.html" %}aria-current="page"{% endif %}>Privacy Policy</a>
        <a href="{{ site.baseurl }}/terms.html" {% if page.url == "/terms.html" %}aria-current="page"{% endif %}>Terms of Use</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      © {{ 'now' | date: '%Y' }} ITPM Group · <a href="mailto:info@itpmgroup.com">info@itpmgroup.com</a> · <a href="https://itpmgroup.com">itpmgroup.com</a>
    </footer>
  </div>
</body>
</html>
